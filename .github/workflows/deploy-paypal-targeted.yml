name: Deploy PayPal credit price fix only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-v3-tcmihuwjlapfaonihdma
  cancel-in-progress: false

jobs:
  approved-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TARGET_PROJECT: tcmihuwjlapfaonihdma
    steps:
      - name: Checkout immutable approved payload
        uses: actions/checkout@v4
        with:
          ref: 6c1f8df8be7948a800d9f09a2fcb70351a8abf53

      - name: Verify exact production project and retain PayPal gateway settings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const ref = process.env.TARGET_PROJECT;
          assert.equal(ref, 'tcmihuwjlapfaonihdma');
          assert.ok(process.env.SUPABASE_ACCESS_TOKEN, 'Missing existing Supabase credential');
          const headers = { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` };
          async function get(path) {
            const response = await fetch(`https://api.supabase.com/v1/projects/${ref}${path}`, { headers });
            if (!response.ok) throw new Error(`Target access failed: HTTP ${response.status}: ${await response.text()}`);
            return response.json();
          }
          const project = await get('');
          assert.equal(project.id, ref, 'Wrong production project');
          const fn = await get('/functions/paypal-ai-credits');
          assert.equal(fn.slug, 'paypal-ai-credits');
          assert.equal(typeof fn.verify_jwt, 'boolean', 'Unknown gateway configuration');
          appendFileSync(process.env.GITHUB_ENV, `PAYPAL_VERIFY_JWT=${fn.verify_jwt}\nPAYPAL_PREVIOUS_VERSION=${fn.version}\n`);
          console.log(`Verified production project ${project.id}; PayPal version ${fn.version}, verify_jwt=${fn.verify_jwt}`);
          NODE

      - name: Deploy only the approved PayPal Edge Function
        shell: bash
        run: |
          args=()
          case "$PAYPAL_VERIFY_JWT" in
            true) ;;
            false) args+=(--no-verify-jwt) ;;
            *) echo 'Unknown previous gateway setting'; exit 1 ;;
          esac
          npx --yes supabase@2.105.0 functions deploy paypal-ai-credits --project-ref "$TARGET_PROJECT" --use-api "${args[@]}"

      - name: Verify PayPal function deployment metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.TARGET_PROJECT}/functions/paypal-ai-credits`, {
            headers: { Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` },
          });
          if (!response.ok) throw new Error(`Function verification failed: HTTP ${response.status}`);
          const fn = await response.json();
          assert.equal(fn.slug, 'paypal-ai-credits');
          assert.equal(fn.status, 'ACTIVE');
          assert.equal(String(fn.verify_jwt), process.env.PAYPAL_VERIFY_JWT);
          assert.ok(Number(fn.version) > Number(process.env.PAYPAL_PREVIOUS_VERSION), 'No new deployed version');
          console.log(`PayPal function ACTIVE at version ${fn.version}; gateway settings preserved.`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- PayPal Edge Function: ACTIVE, version ${fn.version}, verify_jwt=${fn.verify_jwt}\n`);
          NODE
