name: Deploy Építési Napló backend

on:
  workflow_dispatch:
    inputs:
      production_confirmation:
        description: 'Külön tulajdonosi jóváhagyás után írd be: DEPLOY_PRODUCTION'
        required: true
        type: string


jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Supabase temp folder
        run: |
          rm -rf supabase/.temp
          mkdir -p supabase/.temp

      - name: Apply Építési Napló quote schema
        run: |
          npx --yes supabase@latest link --project-ref tcmihuwjlapfaonihdma
          npx --yes supabase@latest db query --linked --file supabase/epitesi_ajanlat_schema.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-szakipiac-import
        run: npx --yes supabase@latest functions deploy create-szakipiac-import --project-ref tcmihuwjlapfaonihdma --no-verify-jwt --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy claim-szakipiac-import
        run: npx --yes supabase@latest functions deploy claim-szakipiac-import --project-ref tcmihuwjlapfaonihdma --no-verify-jwt --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy create-quote-project
        run: npx --yes supabase@latest functions deploy create-quote-project --project-ref tcmihuwjlapfaonihdma --no-verify-jwt --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy AI report generator
        run: npx --yes supabase@latest functions deploy ai-report-generate --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy AI vision analyzer
        run: npx --yes supabase@latest functions deploy ai-vision-analyze --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy account deletion
        run: npx --yes supabase@latest functions deploy delete-account --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin notification
        run: npx --yes supabase@latest functions deploy notify-admin --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy client notification
        run: npx --yes supabase@latest functions deploy notify-client --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy PayPal activation
        run: npx --yes supabase@latest functions deploy paypal-activate --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy PayPal AI credits
        run: npx --yes supabase@latest functions deploy paypal-ai-credits --project-ref tcmihuwjlapfaonihdma --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy public report media
        run: npx --yes supabase@latest functions deploy public-report-media --project-ref tcmihuwjlapfaonihdma --no-verify-jwt --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy share report
        run: npx --yes supabase@latest functions deploy share-report --project-ref tcmihuwjlapfaonihdma --no-verify-jwt --use-api --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
